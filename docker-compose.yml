# OpenZeta — docker compose 用設定
#
#   1. このディレクトリに .env を作る (任意): GEMINI_API_KEY=xxxxx
#   2. docker compose up -d
#   3. http://localhost:3000 を開く
#
# .env が無くても起動できます (アプリ内 Settings で BYOK を設定)。
# 3000 番が埋まっている場合は HOST_PORT を変えてください:
#   HOST_PORT=3001 docker compose up -d

services:
  openzeta:
    build: .
    image: openzeta:latest
    # ローカル専用イメージなのでレジストリから pull しない
    pull_policy: build
    container_name: openzeta
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # サーバー側の Gemini キー (任意)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
